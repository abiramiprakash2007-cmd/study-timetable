<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow — Smart Study Timetable & Planner</title>
  <!-- Google Fonts & Phosphor Icons CDN for crisp modern visuals -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div class="brand-text">
          <h1>StudyFlow</h1>
          <p class="tagline">Smart Study Timetable & Planner</p>
        </div>
      </div>

      <div class="header-center">
        <div class="current-date-badge" id="currentDateBadge">
          <i class="fa-regular fa-calendar-days"></i>
          <span id="headerDateText">Today</span>
        </div>
        <div class="clock-badge">
          <i class="fa-regular fa-clock"></i>
          <span id="liveClock">00:00:00</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="themeToggleBtn" class="icon-btn" title="Toggle Dark/Light Mode" aria-label="Toggle Theme">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="printBtn" class="secondary-btn" title="Print Timetable">
          <i class="fa-solid fa-print"></i>
          <span>Print</span>
        </button>
        <button id="addSessionBtn" class="primary-btn">
          <i class="fa-solid fa-plus"></i>
          <span>Add Session</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="main-container">
    <!-- Quick Stats & Motivation Bar -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon purple">
          <i class="fa-solid fa-book-open"></i>
        </div>
        <div class="stat-info">
          <span class="stat-label">Total Study Slots</span>
          <h3 class="stat-value" id="statTotalSlots">0</h3>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon emerald">
          <i class="fa-solid fa-hourglass-half"></i>
        </div>
        <div class="stat-info">
          <span class="stat-label">Total Planned Hours</span>
          <h3 class="stat-value" id="statTotalHours">0h</h3>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon blue">
          <i class="fa-solid fa-circle-check"></i>
        </div>
        <div class="stat-info">
          <span class="stat-label">Completed Sessions</span>
          <h3 class="stat-value" id="statCompleted">0</h3>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon orange">
          <i class="fa-solid fa-fire"></i>
        </div>
        <div class="stat-info">
          <span class="stat-label">Today's Focus</span>
          <h3 class="stat-value" id="statTodaySessions">0 sessions</h3>
        </div>
      </div>
    </section>

    <!-- Controls & Tab Switcher -->
    <div class="view-controls-bar">
      <div class="tabs-group">
        <button class="tab-btn active" data-view="weekly">
          <i class="fa-solid fa-table-cells"></i> Weekly Timetable
        </button>
        <button class="tab-btn" data-view="agenda">
          <i class="fa-solid fa-list-check"></i> Daily Agenda
        </button>
        <button class="tab-btn" data-view="pomodoro">
          <i class="fa-solid fa-stopwatch"></i> Pomodoro Timer
        </button>
      </div>

      <div class="filters-group">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" placeholder="Search subject or topic...">
        </div>
        
        <select id="dayFilterSelect" class="styled-select" style="display: none;">
          <option value="all">All Days</option>
          <option value="Monday">Monday</option>
          <option value="Tuesday">Tuesday</option>
          <option value="Wednesday">Wednesday</option>
          <option value="Thursday">Thursday</option>
          <option value="Friday">Friday</option>
          <option value="Saturday">Saturday</option>
          <option value="Sunday">Sunday</option>
        </select>

        <div class="data-dropdown">
          <button id="backupMenuBtn" class="icon-btn-bordered" title="Timetable Options">
            <i class="fa-solid fa-ellipsis-vertical"></i>
          </button>
          <div class="dropdown-menu" id="backupMenu">
            <button id="exportJsonBtn"><i class="fa-solid fa-download"></i> Export Data (JSON)</button>
            <label for="importJsonInput" class="dropdown-file-label">
              <i class="fa-solid fa-upload"></i> Import Data (JSON)
            </label>
            <input type="file" id="importJsonInput" accept=".json" style="display: none;">
            <button id="loadSampleBtn"><i class="fa-solid fa-rotate-left"></i> Reset to Sample Data</button>
            <button id="clearAllBtn" class="text-danger"><i class="fa-solid fa-trash-can"></i> Clear All Data</button>
          </div>
        </div>
      </div>
    </div>

    <!-- VIEW 1: Weekly Grid Timetable -->
    <section id="weeklyView" class="view-section active">
      <div class="timetable-scroll-wrapper">
        <div class="weekly-grid" id="weeklyGrid">
          <!-- Dynamically populated headers and day columns -->
        </div>
      </div>
    </section>

    <!-- VIEW 2: Daily Agenda List -->
    <section id="agendaView" class="view-section">
      <div class="agenda-container" id="agendaList">
        <!-- Dynamically rendered day cards with study sessions -->
      </div>
    </section>

    <!-- VIEW 3: Built-in Pomodoro Timer -->
    <section id="pomodoroView" class="view-section">
      <div class="pomodoro-wrapper">
        <div class="pomodoro-card">
          <div class="pomodoro-tabs">
            <button class="pomo-mode-btn active" data-mode="study">Study (25m)</button>
            <button class="pomo-mode-btn" data-mode="shortBreak">Short Break (5m)</button>
            <button class="pomo-mode-btn" data-mode="longBreak">Long Break (15m)</button>
          </div>

          <div class="timer-display">
            <div class="timer-circle-wrap">
              <svg class="progress-ring" width="280" height="280">
                <circle class="progress-ring__circle-bg" stroke="rgba(100, 116, 139, 0.15)" stroke-width="10" cx="140" cy="140" r="120" fill="transparent" />
                <circle id="timerProgressRing" class="progress-ring__circle" stroke="var(--primary-color)" stroke-width="10" stroke-linecap="round" cx="140" cy="140" r="120" fill="transparent" />
              </svg>
              <div class="timer-text-content">
                <span class="timer-digits" id="timerDigits">25:00</span>
                <span class="timer-state-label" id="timerStateLabel">Focus Mode</span>
              </div>
            </div>
          </div>

          <div class="current-task-display">
            <label for="pomoTaskSelect">Current Subject to Focus:</label>
            <select id="pomoTaskSelect" class="styled-select">
              <option value="General Study">🎯 General Study Session</option>
            </select>
          </div>

          <div class="pomodoro-controls">
            <button id="pomoStartBtn" class="timer-btn primary">
              <i class="fa-solid fa-play"></i> Start
            </button>
            <button id="pomoPauseBtn" class="timer-btn secondary" disabled>
              <i class="fa-solid fa-pause"></i> Pause
            </button>
            <button id="pomoResetBtn" class="timer-btn outline">
              <i class="fa-solid fa-rotate-left"></i> Reset
            </button>
          </div>

          <div class="pomodoro-session-stats">
            <div class="pomo-stat-item">
              <span class="count" id="pomoSessionsCompleted">0</span>
              <span class="desc">Pomodoro Cycles Completed</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Add / Edit Session Modal -->
  <div class="modal-overlay" id="sessionModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Add Study Session</h3>
        <button class="close-modal-btn" id="closeModalBtn" aria-label="Close modal">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form id="sessionForm">
        <input type="hidden" id="editSessionId" value="">

        <div class="form-row">
          <div class="form-group full-width">
            <label for="subjectInput">Subject / Course Name *</label>
            <input type="text" id="subjectInput" required placeholder="e.g. Advanced Calculus, Physics, World History">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="daySelect">Day of Week *</label>
            <select id="daySelect" required class="styled-select">
              <option value="Monday">Monday</option>
              <option value="Tuesday">Tuesday</option>
              <option value="Wednesday">Wednesday</option>
              <option value="Thursday">Thursday</option>
              <option value="Friday">Friday</option>
              <option value="Saturday">Saturday</option>
              <option value="Sunday">Sunday</option>
            </select>
          </div>

          <div class="form-group">
            <label for="prioritySelect">Priority</label>
            <select id="prioritySelect" class="styled-select">
              <option value="High">🔴 High Priority</option>
              <option value="Medium" selected>🟡 Medium Priority</option>
              <option value="Low">🟢 Low Priority</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="startTimeInput">Start Time *</label>
            <input type="time" id="startTimeInput" required value="09:00">
          </div>

          <div class="form-group">
            <label for="endTimeInput">End Time *</label>
            <input type="time" id="endTimeInput" required value="10:30">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="topicInput">Topic / Goals / Chapter</label>
            <input type="text" id="topicInput" placeholder="e.g. Chapter 4: Integration by Parts & Exercises">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label>Color Theme Tag</label>
            <div class="color-palette-picker" id="colorPicker">
              <!-- Radio/Chips generated by JS -->
            </div>
            <input type="hidden" id="selectedColor" value="#6366f1">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group full-width">
            <label for="notesInput">Notes / Location / Resources</label>
            <textarea id="notesInput" rows="2" placeholder="e.g. Library 3rd floor, bring textbook & calculator"></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="secondary-btn" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="primary-btn">Save Session</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Scripts -->
  <script src="app.js"></script>
</body>
</html>
